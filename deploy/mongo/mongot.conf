# mongot: the search process that serves $vectorSearch and $search.
#
# It replicates from mongod rather than being written to directly, which is why
# `syncSource` names the replica set and why mongod must be one.

syncSource:
  replicaSet:
    hostAndPort: "mongod:27017"
    tls: false
    readPreference: primaryPreferred

storage:
  dataPath: "/data/mongot"

server:
  grpc:
    address: "0.0.0.0:27028"
    tls:
      mode: "disabled"

metrics:
  enabled: true
  address: "0.0.0.0:9946"

healthCheck:
  address: "0.0.0.0:8080"

logging:
  verbosity: INFO
