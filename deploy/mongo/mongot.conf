# mongot: the search process that serves $vectorSearch and $search.
#
# Mounted over the image's `config.default.yml`, because the container's
# entrypoint hard-codes that path — passing `--config` does nothing.
#
# mongot replicates from mongod rather than being written to directly, which is
# why `syncSource` names the replica set and why mongod must be one.

syncSource:
  replicaSet:
    hostAndPort: "mongod:27017"
    # Authentication is not optional: mongot must present a user holding the
    # `searchCoordinator` role. The password is generated once into a shared
    # volume by the `mongo-secrets` service.
    scramAuth:
      username: mongotUser
      authSource: admin
      passwordFile: /run/secrets/mongo/mongot-password
      tls:
        # Plaintext between mongod and mongot. They share a private compose
        # network with no published ports; a deployment that spreads them
        # across hosts must turn this on.
        enabled: false

storage:
  dataPath: "/data/mongot"

server:
  grpc:
    # 0.0.0.0 rather than localhost: mongod is a different container, so the
    # image's localhost default would make mongot unreachable and every search
    # query fail. Nothing is published to the host.
    address: "0.0.0.0:27028"
    tls:
      mode: "disabled"

metrics:
  enabled: true
  address: "0.0.0.0:9946"

healthCheck:
  address: "0.0.0.0:8080"

logging:
  verbosity: INFO
