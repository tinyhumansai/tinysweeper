# mongod for tinysweeper.
#
# Three things here are requirements, not preferences.
#
# 1. `replSetName` — mongot follows the oplog, so search does not work on a
#    standalone server. A single-member set is fine; a set is not optional.
# 2. `mongotHost` / `searchIndexManagementHostAndPort` — how mongod finds
#    mongot. Without them $vectorSearch and $search do not exist, and the
#    failure surfaces at query time rather than at boot.
# 3. `useGrpcForSearch` — the transport mongot 1.x listens on.

net:
  port: 27017
  bindIpAll: true

replication:
  replSetName: rs0

storage:
  dbPath: /data/db

setParameter:
  mongotHost: mongot:27028
  searchIndexManagementHostAndPort: mongot:27028
  # No authentication between mongod and mongot: they are on a private compose
  # network with no published ports. A deployment that exposes either of them
  # must turn this off and give mongot a keyfile and a `searchCoordinator` user.
  skipAuthenticationToSearchIndexManagementServer: true
  useGrpcForSearch: true
