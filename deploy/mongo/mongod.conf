# mongod for tinysweeper.
#
# Four things here are requirements, not preferences.
#
# 1. `replSetName` — mongot follows the oplog, so search does not work against
#    a standalone server. A single-member set is fine; being a set is not
#    optional.
# 2. `mongotHost` / `searchIndexManagementHostAndPort` — how mongod finds
#    mongot. Without them $vectorSearch and $search do not exist, and the
#    failure surfaces at query time rather than at boot.
# 3. `useGrpcForSearch` — the transport mongot 1.x listens on.
# 4. `keyFile` plus `authorization` — mongot authenticates to mongod as a user
#    holding the `searchCoordinator` role, and enabling auth on a replica set
#    requires internal authentication. mongot has no unauthenticated mode.

net:
  port: 27017
  bindIpAll: true

replication:
  replSetName: rs0

storage:
  dbPath: /data/db

security:
  authorization: enabled
  keyFile: /run/secrets/mongo/keyfile

setParameter:
  mongotHost: mongot:27028
  searchIndexManagementHostAndPort: mongot:27028
  skipAuthenticationToSearchIndexManagementServer: false
  useGrpcForSearch: true
