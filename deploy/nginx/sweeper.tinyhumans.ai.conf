# Host nginx vhost for tinysweeper. Installed as
# /etc/nginx/sites-available/sweeper.tinyhumans.ai.conf and symlinked into
# sites-enabled; nginx itself is the box's, shared with its other services.
#
# The domain is proxied by Cloudflare, which connects to this origin over
# HTTPS. The 443 block is therefore not optional: without a TLS server for
# this name, nginx falls through to the first one it has -- another project's
# -- and Cloudflare serves that site under this domain.
#
# Issuing the certificate is a chicken-and-egg: this file will not load until
# /etc/letsencrypt/live/sweeper.tinyhumans.ai exists, and certbot cannot answer
# the challenge until nginx serves the name. Install the port 80 block alone
# first, issue, then install the whole file:
#
#   sudo certbot certonly --webroot -w /var/www/certbot -d sweeper.tinyhumans.ai
#   sudo nginx -t && sudo systemctl reload nginx
#
# Only the three routes the server exposes are proxied. Anything else is a 404
# here, so a scanner poking the public address learns nothing about what runs
# behind it.

upstream tinysweeper {
    # TINYSWEEPER_HOST_PORT in /opt/tinysweeper/.env; 8080 belongs to another
    # service on this box.
    server 127.0.0.1:8081;
    keepalive 4;
}

server {
    listen 80;
    listen [::]:80;
    server_name sweeper.tinyhumans.ai;

    # Kept open on both ports: Let's Encrypt reaches this origin through
    # Cloudflare, which forwards the challenge over whichever port its SSL
    # mode dictates rather than the one the ACME client dialled.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sweeper.tinyhumans.ai;

    ssl_certificate     /etc/letsencrypt/live/sweeper.tinyhumans.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sweeper.tinyhumans.ai/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # GitHub's webhook. HMAC-verified in the app; GitHub gives up on a delivery
    # after ten seconds and the server acknowledges before it reviews, so
    # nothing here may buffer or slow the response down.
    location = /webhook {
        proxy_pass http://tinysweeper;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    location = /healthz {
        proxy_pass http://tinysweeper;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }

    # The operator API. Bearer-authenticated in the app (TINYSWEEPER_ADMIN_TOKEN)
    # and driven by manual-review.yml; a full re-review enqueues and returns,
    # but the index and knowledge routes can take a while.
    location /admin {
        proxy_pass http://tinysweeper;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # The UI preview session routes, called by the ui-preview action in other
    # repositories' CI (TINYSWEEPER_PREVIEW_TOKEN). A step carries a page's
    # accessibility snapshot and a finish carries a manifest; the app caps the
    # body at 512k, and a driving turn waits on one model call.
    location /preview {
        proxy_pass http://tinysweeper;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        proxy_read_timeout 180s;
    }

    # Authenticated Model Context Protocol endpoint. Requests can include
    # repository questions and issue bodies, so cap them independently of the
    # webhook and allow enough time for embedding and GitHub reads.
    location = /mcp {
        proxy_pass http://tinysweeper;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        proxy_read_timeout 180s;
    }

    location / {
        return 404;
    }
}
