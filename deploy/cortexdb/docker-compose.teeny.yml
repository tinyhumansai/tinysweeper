# Overlay for the box that also runs teeny: join teeny's network so its agent
# reaches the engine as `cortexdb`, and adopt the volume teeny's own CortexDB
# wrote before the engine became shared on 2026-09-13.
#
#   docker compose -f docker-compose.yml -f docker-compose.teeny.yml up -d --wait
#
# Both resources are `external`: compose never creates or removes them, so a
# `down -v` here leaves teeny's memory where it is, and a host without teeny
# simply does not use this file.

services:
  cortexdb:
    networks:
      - teeny

networks:
  teeny:
    name: teeny_default
    external: true

volumes:
  cortexdb-data:
    name: teeny_cortexdb-data
    external: true
