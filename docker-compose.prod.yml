# Production overlay for the single-host deployment.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# tinysweeper runs on one shared DigitalOcean box as a Compose stack: the
# mongod/mongot pair from the base file and the server. TLS is not this
# stack's job — the box already runs nginx on 80/443 for its other services,
# and `deploy/nginx/sweeper.tinyhumans.ai.conf` is the vhost that proxies to
# the port published here. There is no Kubernetes cluster any more;
# `.github/workflows/deploy.yml` reaches this stack over SSH and runs the two
# commands in `deploy/README.md`.
#
# Three differences from the base file, and only three:
#
#   * The server is the image CI published to GHCR, not a local build. The box
#     never compiles anything — a `cargo build` on a shared droplet takes
#     longer than the rollout it is part of and leaves the host as the only
#     place the running binary exists.
#   * The server's port is published on loopback only, and not on 8080, which
#     another service on the box already holds. nginx is the only thing that
#     talks to it, and GitHub only ever sees HTTPS.
#   * The variables the base file does not forward. `TINYSWEEPER_ADMIN_TOKEN`
#     is what `manual-review.yml` authenticates with, `TINYSWEEPER_ALLOWED_ORG`
#     is what the server bounds those manual reviews to, and Langfuse is
#     optional but production is the one place it is worth turning on.

services:
  tinysweeper:
    # `!reset null` drops the base file's `build:` block entirely. Leaving it
    # in alongside `image:` makes `compose up` prefer the local build whenever
    # the image is missing, which is precisely the case on a fresh box.
    build: !reset null
    image: ghcr.io/tinyhumansai/tinysweeper:${TINYSWEEPER_IMAGE_TAG:-latest}
    ports: !override
      - "127.0.0.1:${TINYSWEEPER_HOST_PORT:-8081}:8080"
    environment:
      TINYSWEEPER_ADMIN_TOKEN: ${TINYSWEEPER_ADMIN_TOKEN:-}
      TINYSWEEPER_PREVIEW_TOKEN: ${TINYSWEEPER_PREVIEW_TOKEN:-}
      TINYSWEEPER_ALLOWED_ORG: ${TINYSWEEPER_ALLOWED_ORG:-tinyhumansai}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-production}
    healthcheck:
      # The runtime image is debian-slim without curl, so the probe is a raw
      # HTTP request over bash's /dev/tcp. It only has to distinguish "the
      # server answers" from "it does not"; nginx's upstream health is what an
      # outside observer sees.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    # The box is shared. On the cluster this ran under a 1 GiB limit and was
    # OOM-killed on full graph builds; 4 GiB is room for that without letting
    # one runaway index take the other tenants down with it.
    deploy:
      resources:
        limits:
          memory: 4g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # The database stays reachable from the host's loopback only, exactly as in
  # the base file; the overlay repeats it so a future edit to the base cannot
  # silently open 27017 to the internet on the production box.
  mongod:
    ports: !override
      - "127.0.0.1:${MONGO_HOST_PORT:-27017}:27017"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  mongot:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
