# Built-in defaults — the bottom layer of the configuration merge.
#
# Merge order, later wins: these defaults, then the named preset, then the
# repository's own .tinysweeper.toml. `tinysweeper doctor` reports which layer
# set each effective value, and it reads that from the same merge that produces
# the config, so the two can never disagree.
#
# Every value here has to be safe for a repository that has never seen the bot:
# conservative gates, no auto-merge, no scaffolded feature enabled.

version = 1

[review]
lanes = ["critique", "security", "tests", "commits", "description"]
# The one dial most repositories should touch. 1 chill, 2 default, 3 assertive.
# `severity_gate` and `confidence_min` are deliberately absent: strictness sets
# them, and setting them here would make the dial inert for everyone who never
# overrode them — which is exactly the bug this replaced.
strictness = 2
max_comments = 20
incremental = true
draft_prs = false
respect_agents_md = true

# Block the merge button at this severity; "off" never blocks. A blocking review
# has to be cleared by a human if it turns out to be wrong, so the floor sits at
# the severity where that cost is worth paying — and the next clean review
# clears it automatically, so the usual case needs nobody.
request_changes_at = "high"

# Approve when every lane passed. This is the other half of the blocking
# verdict: a review that can only ever object leaves a pull request it has
# nothing against sitting behind a "review required" rule forever, and leaves a
# previous objection standing after the fix. One approval per clean head — a
# second is not submitted while the first still stands.
approve_when_clean = true

# The change-map comment: one diagram of what the pull request touches and what
# it reaches, edited in place on every push. On by default, which is safe in a
# way most defaults here are not — it makes no model call, so it costs nothing,
# and it posts exactly one comment however many times the branch is pushed.
[overview]
enabled = true
max_components = 10
max_impacted = 6
max_links = 24
max_paths_per_component = 12

[paths]
ignore = [
    "**/*.lock",
    "vendor/**",
    "**/generated/**",
    "**/node_modules/**",
    "**/*.min.js",
    "**/*.snap",
]

[cache]
enabled = true
semantic = true
max_age_days = 14

[labels]
human_review = "tinysweeper:human-review"
manual_only = "tinysweeper:manual-only"

# Model tiers. Prices below are per million tokens, verified against
# openrouter.ai/api/v1/models on 2026-08-08, DeepSeek re-checked 2026-08-13 —
# re-check before assuming they still hold, the catalogue moves fast.
#
#   deepseek/deepseek-v4-pro-0813  1,048,576 ctx   $0.435 / $0.87
#   z-ai/glm-5.2                   1,048,576 ctx   $0.753 / $2.367
#   minimax/minimax-m3             1,048,576 ctx   $0.30  / $1.20
#   moonshotai/kimi-k3             1,048,576 ctx   $3.00  / $15.00
#   moonshotai/kimi-k2.7-code        262,144 ctx   $0.70  / $3.50
#
# The GLM row was $0.07 / $0.22 until 2026-08-13 and was wrong by ten times —
# no endpoint has ever served it that cheaply. Two conclusions in this file
# rested on it and do not survive: DeepSeek is **cheaper per token** than GLM on
# output, not several times dearer, and GLM was already spending past the eval
# corpus's $0.02-per-case budget before any model changed.
#
# Everything in that list carries a million-token context except the last, and
# context is exactly what a reviewer that pulls in surrounding code runs out of
# first — it is a floor for anything considered here, not a tiebreaker.
[models]
gateway = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
# Both tiers on one model, and the tiering kept rather than collapsed.
#
# DeepSeek V4 Pro, pinned to the dated `0813` GA snapshot rather than the
# floating `deepseek/deepseek-v4-pro` alias. The alias is a different, older
# build and moves without a config change; a reviewer whose output shape is a
# strict JSON schema should not have its model swapped underneath it silently.
#
# **This snapshot is served only by DeepSeek first-party.** An OpenRouter
# account whose allowed-providers list excludes `deepseek` gets a 404 —
# "No allowed providers are available for the selected model" — on every call,
# and every review falls through to the chain below. If reviews are quietly
# still coming back as GLM, that is the cause: fix it at
# https://openrouter.ai/settings/privacy, not here.
#
# The two keys stay separate because the *shape* of the decision is worth
# keeping: `scan` is mechanical work run often, `deep` reads code closely. A
# deployment that wants a stronger deep tier changes one line, and the cost of
# doing so is visible — the previous deep model's $3.00/M input against 83k
# input tokens per security-lane call was where the bill actually came from.
scan = "deepseek/deepseek-v4-pro-0813"
deep = "deepseek/deepseek-v4-pro-0813"
# Tried in order when the selected model fails. Both were measured against the
# reasoning setting below and both answer a strict JSON schema cleanly; a
# previous entry did not, and refused every request with "Reasoning is
# mandatory for this endpoint", which made the whole chain a guaranteed failure
# rather than a safety net.
#
# GLM 5.2 leads because it is the model this deployment ran as its primary
# until now, on 5/5 clean structured-output runs — a safety net is worth more
# when it is the thing you just came off. The V4 Pro alias is deliberately
# *not* here: it is reachable when the pinned snapshot is not, so including it
# would turn a provider misconfiguration into a silent downgrade to the older
# build instead of a visible one.
fallback = ["z-ai/glm-5.2", "minimax/minimax-m3"]
# A ceiling, not a purchase: tokens are billed as produced, so raising this
# costs nothing on the calls that finish early and buys headroom on the ones
# that would otherwise be cut off. It was 8000, which is the same budget the
# *reasoning* is drawn from — see `reasoning_effort` below — so a lane reviewing
# a large diff was thinking and answering out of one 8000-token allowance.
#
# Running out entirely is loud: the harness turns empty content with
# `finish_reason = "length"` into an error naming this key. Running out *part
# way* through the findings array is the quiet one — the repair ladder salvages
# the findings that arrived and the rest are simply never seen, which reads
# exactly like a clean review. That is the failure this number is set against.
max_tokens = 16000
# Reasoning is billed against `max_tokens`, and this key does **not** bound it.
#
# The 416-token figure that used to be recorded here was measured on a toy
# prompt and did not survive contact with a real one. Re-measured against a
# 23k-token diff with a demanding system prompt, both configured models spend
# reasoning like this:
#
# `max_tokens` below is the ceiling each *run* was given, not the shipped
# budget. The shipped value — 16000, set at the bottom of this block — clears
# the 12000 floor this change validates against; the 8000 rows show the budget
# that fails, the 32000 rows the one that clears.
#
#   model               effort  max_tokens  reasoning  content
#   z-ai/glm-5.2        high      8000        8000     empty, finish=length
#   z-ai/glm-5.2        low       8000        8000     empty, finish=length
#   z-ai/glm-5.2        off       8000           0     2572 tokens, 13 findings
#   z-ai/glm-5.2        high     32000           8     7429 tokens, 23 findings
#   deepseek-v4-pro     high      8000        8000     empty, finish=length
#   deepseek-v4-pro     low       8000        8000     empty, finish=length
#   deepseek-v4-pro     off       8000           0      966 tokens
#   deepseek-v4-pro     high     32000        8152     9246 tokens
#
# Those `deepseek-v4-pro` rows were measured on the floating alias, which is a
# different and older build than the `-0813` snapshot now selected above. They
# are kept because the shape of the finding is what matters and it held across
# two unrelated models — but `-0813` itself has not been put through this
# table. Treat its reasoning spend as unmeasured rather than as inherited, and
# re-run the sweep before trusting `high` on a harder prompt than production
# has already shown it.
#
# Two things in that table are worth keeping. First, `low` is not a smaller
# `high`: both models burned the *entire* allowance thinking at either setting,
# so turning the dial down is not a way to bound spend — only `off` is. Second,
# the failure is bimodal rather than gradual. There is no setting at which the
# model thinks a bit and answers a bit; either reasoning fits and the answer is
# whole, or reasoning takes everything and the content is empty.
#
# `high` is kept because `max_tokens` above is now 16000, which cleared it in
# production — no structured-output failure and no fallback in the hours after
# the deploy. 16000 itself was never measured; the table brackets it with the
# ceiling that fails (8000) and the one that stays safe (32000), where
# `deepseek-v4-pro` spent 8152 of the allowance on reasoning before it
# answered. A harder prompt is one step from the same cliff. If this starts
# failing again, `off` is the fix that is *proven* rather than the one that
# buys room, and it costs 13 findings against 23.
reasoning_effort = "high"
# Who enforces the response schema, and the reason the model above is usable at
# all.
#
# `schema` is the strong setting and the default: the provider is handed the
# JSON schema and cannot generate anything that does not fit it. It is not an
# option here. `deepseek-v4-pro-0813` answers a strict schema request with
#
#   400 — "This response_format type is unavailable now"
#
# on every call, so a deployment on `schema` never reaches DeepSeek at all: it
# fails, falls through to GLM, and looks like it is working. That was measured,
# not inferred — a corpus re-record produced 29 of 29 answers from the fallback.
#
# `json_object` is DeepSeek's own JSON mode. The provider guarantees the answer
# is well-formed json and nothing about its shape; the schema travels in the
# system prompt instead, and `harness::schema::parse` rejects a mismatch. Be
# clear about what that trades: a wrong *shape* is now caught by us rather than
# prevented by them. It is still never prose — the answer is always parseable
# json or a hard error — but it is weaker than `schema`, and a deployment whose
# models all support strict schemas should stay on `schema`.
#
# The setting applies to the whole chain, fallbacks included, because any model
# in it can answer a given review and the prompt is built before the answering
# model is known. GLM 5.2 and MiniMax M3 both accept `json_object`, so the
# safety net still works.
structured_output = "json_object"
budget_usd_per_pr = 1.0

# Several reviewers on one lane's evidence, folded into one review.
#
# Off, and off is the honest default: a second reviewer doubles the calls for
# that lane, and whether it is worth the money is a question `tinysweeper eval`
# answers rather than one anybody should guess. `[council]` is also on the *not
# overridable* list in `src/config/remote` — every key here spends the
# operator's money, which is the same line drawn around `[models]`.
#
# `corroboration` is a separate switch on purpose. With one agent the merge is
# a provable no-op, so it can be turned on and measured before a second agent
# is what is being judged.
[council]
enabled = false
corroboration = true
agents = []

# The knowledge centre. `files` are read from the pull request's head commit
# through the forge and are untrusted input — they are put through a sandboxed
# extraction pass rather than injected. Plain filenames only: a name containing
# a path separator or `..` is dropped, because this list is editable by whoever
# opens the pull request.
[knowledge]
extract = true
files = ["AGENTS.md", "CLAUDE.md", ".tinysweeper.md"]
max_file_bytes = 65536
# Pinned documents are paid for on every review of every pull request in scope,
# so both caps are budgets rather than limits nobody reaches.
pinned_doc_chars = 4000
pinned_total_chars = 12000

# The embedding provider behind the code index.
#
# Off by default: it costs money per indexed byte and needs a key, so a
# deployment that has not opted in runs diff-only exactly as it did before.
# `provider`, `model` and `dimensions` are the index partition key — changing
# one invalidates every vector already written, by construction — so they are
# filled in here as the recommendation rather than left blank.
#
# voyage-code-3 is the default because the corpus is code. It is trained on
# code retrieval specifically, it is the strongest of the priced options on
# CodeSearchNet-style benchmarks, and at $0.18/M it is within a rounding error
# of Voyage's general model. 1024 dimensions is its native width and the one
# the MongoDB vector index is cheapest to store: float32 binData at 1024 dims
# is ~4 KiB per document against ~6 KiB at 1536.
#
# openai/text-embedding-3-small is the cheap alternative ($0.02/M, 1536 dims)
# and is meaningfully worse at code; use it when the bill matters more than the
# hit quality. Set `base_url` and point `provider = "openai"` at a local
# OpenAI-compatible server to embed without leaving the network at all.
[embeddings]
enabled = false
# The same gateway the completion models use, so one key and one bill cover
# the whole product. `dimensions` is not discoverable from the API — it is
# measured against the model and pinned here, because it is both the index
# partition key and the width the search index is created with.
provider = "openrouter"
model = "openai/text-embedding-3-small"
dimensions = 1536
api_key_env = "OPENROUTER_API_KEY"
base_url = ""
batch = 64
# The ceiling the provider actually enforces. `batch` bounds how many texts go
# in a call; this bounds how large they are, which is the limit an embedding
# API rejects on. Sizing by count alone meant 64 chunks of real source hit
# OpenAI's 300,000-token request limit at 467,846 tokens, so every large
# repository indexed nothing and reviewed from the diff alone while small ones
# looked fine. Counted with the four-bytes-per-token estimate, which is about
# half the true rate for code — hence 120,000 here against a 300,000 limit.
max_request_tokens = 120000
requests_per_minute = 60
budget_usd_per_index = 5.0
# Retrieval budgets. `context_tokens` is the number that matters: at roughly
# four bytes to a token, 8000 tokens is ~32 KB of related code per lane, which
# is comparable to the diff it accompanies rather than a garnish beside it, and
# across five lanes it is about 12% of `models.budget_usd_per_pr` at the deep
# tier's input price. Raise it if reviews keep asking for code they were not
# shown; lower it if the cost line is dominated by context nobody used.
[retrieval]
enabled = true
query_chars = 4000
context_tokens = 8000
max_chunks = 40
graph_hops = 2
max_graph_nodes = 60
max_impact = 20

[lanes.critique]
model = "deep"
fail_on = "high"

[lanes.security]
model = "deep"
fail_on = "high"

[lanes.tests]
model = "scan"
fail_on = "high"

# No `model` key: this lane makes no model call. It republishes what the
# deterministic scanners found in the commit range and forms no opinion of its
# own, so its verdict is a regular expression's, not a model's.
[lanes.commits]
fail_on = "high"
secret_rulepack = "default"
max_blob_bytes = 1048576

[lanes.description]
model = "scan"
fail_on = "high"

# Auto-merge. Off until a repository opts in deliberately: this is the one
# module that can put code on the default branch without a human, and a
# wrongly-merged pull request cannot be un-merged. Every threshold below fails
# closed — an unreadable or missing value means "do not merge", never "assume
# fine" — and every one of them is arithmetic over observable state. No model
# output reaches this decision.
[automerge]
enabled = false
# The lane checks, named individually. There used to be one aggregate
# `tinysweeper/gate` to require instead; it is gone, and the verdict it carried
# now arrives as the bot's own approving review. Listing the lanes here is the
# closer equivalent — requiring the review would mean auto-merge gated on the
# bot's own approval, which is circular.
require_checks = [
    "tinysweeper/critique",
    "tinysweeper/security",
    "tinysweeper/tests",
    "tinysweeper/commits",
]
require_approvals = 1
method = "squash"
allow_labels = ["automerge"]
block_labels = ["do-not-merge", "wip"]
# Size caps. A change past any one of these is not necessarily wrong, it is
# merely past the point where a machine reading conclusions can be confident,
# so it waits for a person.
max_files = 20
max_changed_lines = 400
max_hunks = 30
max_directories = 5
# Paths that always want a human, because they change what runs or who may run
# it. Dependency manifests are here too; the dependency-bump exemption below is
# what lets a manifest-only bump through anyway.
sensitive_paths = [
  ".github/**",
  "**/.github/**",
  "**/Dockerfile*",
  "**/docker-compose*.y*ml",
  "**/*.tf",
  "**/k8s/**",
  "**/helm/**",
  "**/deploy/**",
  "**/infra/**",
  "**/migrations/**",
  "**/auth/**",
  "**/*auth*.rs",
  "**/secrets*",
  "AGENTS.md",
  "CLAUDE.md",
  "**/CODEOWNERS",
  "Cargo.toml",
  "**/Cargo.toml",
  "Cargo.lock",
  "**/package.json",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/yarn.lock",
  "**/requirements*.txt",
  "**/pyproject.toml",
  "**/poetry.lock",
  "**/go.mod",
  "**/go.sum",
  "**/Gemfile*",
]
# Dependency bumps. They touch manifests and lockfiles by definition, so the
# sensitive-path and complexity refusals would block every one of them forever.
# The exemption is narrow: the author must be one of these exact logins *and*
# be reported by GitHub as `type: "Bot"`, and every changed path must be a
# manifest or lockfile. One source file in the same pull request and it is an
# ordinary change again.
allow_dependency_bumps = true
dependency_bots = ["dependabot[bot]", "renovate[bot]"]
dependency_paths = [
  "Cargo.toml",
  "**/Cargo.toml",
  "Cargo.lock",
  "**/package.json",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/yarn.lock",
  "**/requirements*.txt",
  "**/pyproject.toml",
  "**/poetry.lock",
  "**/go.mod",
  "**/go.sum",
  "**/Gemfile",
  "**/Gemfile.lock",
]

# Issue triage. Off by default: a bot that starts labelling and closing issues
# the moment it is installed is a bot that gets uninstalled.
[issues]
enabled = false
model = "scan"
comment = true
apply_labels = true
max_labels = 3
# Set GitHub's native issue type, but only where the issue has none: replacing
# a type a human chose destroys it, where a label merely joins the others.
apply_issue_type = true
allow_labels = []
block_labels = ["tinysweeper:human-review", "tinysweeper:manual-only"]
dedupe = true
dedupe_confidence_min = 0.75

# Closing someone's issue is the most expensive mistake this bot can make.
# Every guard below is an age or authorship check that no model output can
# override, and closing stays off until a repository explicitly asks for it.
[issues.close]
enabled = false
min_age_days = 60
quiet_days = 60
confidence_min = 0.85
protected_labels = ["pinned", "security", "tinysweeper:human-review"]
protected_authors = []
dry_run = true

[automation]
enabled = false
merge_sweep = false

[automation.stale]
enabled = false
days_until_stale = 90
# `days_until_close` is deliberately absent: the safe default marks and never
# closes. Set it explicitly to opt into closing.
label = "stale"
exempt_labels = ["pinned", "security", "roadmap"]

[automation.labeler]
enabled = false
size = true

[sentry]
enabled = false
token_env = "SENTRY_AUTH_TOKEN"
base_url = "https://sentry.io/api/0"
min_events = 10
min_users = 1
ignore_culprits = []
labels = ["sentry", "bug"]
max_per_run = 10
annotate_sentry = true
resolve_when_tracked = false
scrub_patterns = []

# Which repository each project promotes into. Empty by default, because there
# is no defensible default: guessing a repository from a project slug is how
# issues get opened in someone else's tracker. A project in `projects` with no
# route here is skipped and logged, never guessed.
#
# [[sentry.route]]
# project = "api"
# repo    = "tinyhumansai/backend"
# labels  = ["area: sentry"]

[threads]
# Close a conversation the review agent confirms the new code fixed.
# The agent sees the prior finding and current diff; apply still requires an
# outdated thread opened by tinysweeper before it writes anything.
resolve_fixed = true
# Ask a model whether a reply settled a finding the code did not change. Off:
# the only evidence in that case is a comment, and comments are untrusted input.
ask_model = false
