# Built-in defaults — the bottom layer of the configuration merge.
#
# Merge order, later wins: these defaults, then the named preset, then the
# repository's own .tinysweeper.toml. `tinysweeper doctor` reports which layer
# set each effective value, and it reads that from the same merge that produces
# the config, so the two can never disagree.
#
# Every value here has to be safe for a repository that has never seen the bot:
# conservative gates, no auto-merge, no scaffolded feature enabled.

version = 1

[review]
lanes = ["critique", "security", "tests", "commits", "description"]
# The one dial most repositories should touch. 1 chill, 2 default, 3 assertive.
# `severity_gate` and `confidence_min` are deliberately absent: strictness sets
# them, and setting them here would make the dial inert for everyone who never
# overrode them — which is exactly the bug this replaced.
strictness = 2
max_comments = 20
incremental = true
draft_prs = false
respect_agents_md = true

# Block the merge button at this severity; "off" never blocks. A blocking review
# has to be cleared by a human if it turns out to be wrong, so the floor sits at
# the severity where that cost is worth paying — and the next clean review
# clears it automatically, so the usual case needs nobody.
request_changes_at = "high"

# Approve when every lane passed. This is the other half of the blocking
# verdict: a review that can only ever object leaves a pull request it has
# nothing against sitting behind a "review required" rule forever, and leaves a
# previous objection standing after the fix. One approval per clean head — a
# second is not submitted while the first still stands.
approve_when_clean = true

[paths]
ignore = [
    "**/*.lock",
    "vendor/**",
    "**/generated/**",
    "**/node_modules/**",
    "**/*.min.js",
    "**/*.snap",
]

[cache]
enabled = true
semantic = true
max_age_days = 14

[labels]
human_review = "tinysweeper:human-review"
manual_only = "tinysweeper:manual-only"

# Model tiers. Prices below are per million tokens, verified against
# openrouter.ai/api/v1/models on 2026-08-08 — re-check before assuming they
# still hold, the catalogue moves fast.
#
#   minimax/minimax-m3        1,048,576 ctx   $0.30 / $1.20
#   moonshotai/kimi-k3        1,048,576 ctx   $3.00 / $15.00
#   moonshotai/kimi-k2.7-code   262,144 ctx   $0.70 / $3.50
#
# The scan tier is m3 rather than the cheaper-looking m2.1 because they cost the
# same and m3 carries five times the context — and context is exactly what a
# reviewer that pulls in surrounding code runs out of first.
[models]
gateway = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
scan = "minimax/minimax-m3"
deep = "moonshotai/kimi-k3"
# Tried in order when the selected model fails. The code-tuned Kimi sits first
# because a review that falls back should stay good at reading code.
fallback = ["moonshotai/kimi-k2.7-code", "minimax/minimax-m2.1"]
max_tokens = 8000
budget_usd_per_pr = 1.0

# The knowledge centre. `files` are read from the pull request's head commit
# through the forge and are untrusted input — they are put through a sandboxed
# extraction pass rather than injected. Plain filenames only: a name containing
# a path separator or `..` is dropped, because this list is editable by whoever
# opens the pull request.
[knowledge]
extract = true
files = ["AGENTS.md", "CLAUDE.md", ".tinysweeper.md"]
max_file_bytes = 65536
# Pinned documents are paid for on every review of every pull request in scope,
# so both caps are budgets rather than limits nobody reaches.
pinned_doc_chars = 4000
pinned_total_chars = 12000

# The embedding provider behind the code index.
#
# Off by default: it costs money per indexed byte and needs a key, so a
# deployment that has not opted in runs diff-only exactly as it did before.
# `provider`, `model` and `dimensions` are the index partition key — changing
# one invalidates every vector already written, by construction — so they are
# filled in here as the recommendation rather than left blank.
#
# voyage-code-3 is the default because the corpus is code. It is trained on
# code retrieval specifically, it is the strongest of the priced options on
# CodeSearchNet-style benchmarks, and at $0.18/M it is within a rounding error
# of Voyage's general model. 1024 dimensions is its native width and the one
# the MongoDB vector index is cheapest to store: float32 binData at 1024 dims
# is ~4 KiB per document against ~6 KiB at 1536.
#
# openai/text-embedding-3-small is the cheap alternative ($0.02/M, 1536 dims)
# and is meaningfully worse at code; use it when the bill matters more than the
# hit quality. Set `base_url` and point `provider = "openai"` at a local
# OpenAI-compatible server to embed without leaving the network at all.
[embeddings]
enabled = false
# The same gateway the completion models use, so one key and one bill cover
# the whole product. `dimensions` is not discoverable from the API — it is
# measured against the model and pinned here, because it is both the index
# partition key and the width the search index is created with.
provider = "openrouter"
model = "openai/text-embedding-3-small"
dimensions = 1536
api_key_env = "OPENROUTER_API_KEY"
base_url = ""
batch = 64
requests_per_minute = 60
budget_usd_per_index = 5.0
# Retrieval budgets. `context_tokens` is the number that matters: at roughly
# four bytes to a token, 8000 tokens is ~32 KB of related code per lane, which
# is comparable to the diff it accompanies rather than a garnish beside it, and
# across five lanes it is about 12% of `models.budget_usd_per_pr` at the deep
# tier's input price. Raise it if reviews keep asking for code they were not
# shown; lower it if the cost line is dominated by context nobody used.
[retrieval]
enabled = true
query_chars = 4000
context_tokens = 8000
max_chunks = 40
graph_hops = 2
max_graph_nodes = 60

[lanes.critique]
model = "deep"
fail_on = "high"

[lanes.security]
model = "deep"
fail_on = "high"

[lanes.tests]
model = "scan"
fail_on = "high"

# No `model` key: this lane makes no model call. It republishes what the
# deterministic scanners found in the commit range and forms no opinion of its
# own, so its verdict is a regular expression's, not a model's.
[lanes.commits]
fail_on = "high"
secret_rulepack = "default"
max_blob_bytes = 1048576

[lanes.description]
model = "scan"
fail_on = "high"

# Auto-merge. Off until a repository opts in deliberately: this is the one
# module that can put code on the default branch without a human, and a
# wrongly-merged pull request cannot be un-merged. Every threshold below fails
# closed — an unreadable or missing value means "do not merge", never "assume
# fine" — and every one of them is arithmetic over observable state. No model
# output reaches this decision.
[automerge]
enabled = false
require_checks = ["tinysweeper/gate"]
require_approvals = 1
method = "squash"
allow_labels = ["automerge"]
block_labels = ["do-not-merge", "wip"]
# Size caps. A change past any one of these is not necessarily wrong, it is
# merely past the point where a machine reading conclusions can be confident,
# so it waits for a person.
max_files = 20
max_changed_lines = 400
max_hunks = 30
max_directories = 5
# Paths that always want a human, because they change what runs or who may run
# it. Dependency manifests are here too; the dependency-bump exemption below is
# what lets a manifest-only bump through anyway.
sensitive_paths = [
  ".github/**",
  "**/.github/**",
  "**/Dockerfile*",
  "**/docker-compose*.y*ml",
  "**/*.tf",
  "**/k8s/**",
  "**/helm/**",
  "**/deploy/**",
  "**/infra/**",
  "**/migrations/**",
  "**/auth/**",
  "**/*auth*.rs",
  "**/secrets*",
  "AGENTS.md",
  "CLAUDE.md",
  "**/CODEOWNERS",
  "Cargo.toml",
  "**/Cargo.toml",
  "Cargo.lock",
  "**/package.json",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/yarn.lock",
  "**/requirements*.txt",
  "**/pyproject.toml",
  "**/poetry.lock",
  "**/go.mod",
  "**/go.sum",
  "**/Gemfile*",
]
# Dependency bumps. They touch manifests and lockfiles by definition, so the
# sensitive-path and complexity refusals would block every one of them forever.
# The exemption is narrow: the author must be one of these exact logins *and*
# be reported by GitHub as `type: "Bot"`, and every changed path must be a
# manifest or lockfile. One source file in the same pull request and it is an
# ordinary change again.
allow_dependency_bumps = true
dependency_bots = ["dependabot[bot]", "renovate[bot]"]
dependency_paths = [
  "Cargo.toml",
  "**/Cargo.toml",
  "Cargo.lock",
  "**/package.json",
  "**/package-lock.json",
  "**/pnpm-lock.yaml",
  "**/yarn.lock",
  "**/requirements*.txt",
  "**/pyproject.toml",
  "**/poetry.lock",
  "**/go.mod",
  "**/go.sum",
  "**/Gemfile",
  "**/Gemfile.lock",
]

# Issue triage. Off by default: a bot that starts labelling and closing issues
# the moment it is installed is a bot that gets uninstalled.
[issues]
enabled = false
model = "scan"
comment = true
apply_labels = true
max_labels = 3
allow_labels = []
block_labels = ["tinysweeper:human-review", "tinysweeper:manual-only"]
dedupe = true
dedupe_confidence_min = 0.75

# Closing someone's issue is the most expensive mistake this bot can make.
# Every guard below is an age or authorship check that no model output can
# override, and closing stays off until a repository explicitly asks for it.
[issues.close]
enabled = false
min_age_days = 60
quiet_days = 60
confidence_min = 0.85
protected_labels = ["pinned", "security", "tinysweeper:human-review"]
protected_authors = []
dry_run = true

[automation]
enabled = false
merge_sweep = false

[automation.stale]
enabled = false
days_until_stale = 90
# `days_until_close` is deliberately absent: the safe default marks and never
# closes. Set it explicitly to opt into closing.
label = "stale"
exempt_labels = ["pinned", "security", "roadmap"]

[automation.labeler]
enabled = false
size = true

[sentry]
enabled = false
token_env = "SENTRY_AUTH_TOKEN"
base_url = "https://sentry.io/api/0"
min_events = 10
min_users = 1
ignore_culprits = []
labels = ["sentry", "bug"]
max_per_run = 10
annotate_sentry = true
resolve_when_tracked = false
scrub_patterns = []
