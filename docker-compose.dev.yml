name: tinysweeper-dev

services:
  tinysweeper:
    build:
      context: .
      target: development
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
    working_dir: /workspace
    environment:
      RUST_LOG: ${RUST_LOG:-tinysweeper=debug}
    command: ["cargo", "watch", "-x", "clippy --all-targets"]

volumes:
  cargo-registry:
