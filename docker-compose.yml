name: tinysweeper

services:
  tinysweeper:
    build:
      context: .
      target: runtime
      args:
        FEATURES: ${TINYSWEEPER_FEATURES:-all}
    image: ghcr.io/tinyhumansai/tinysweeper:local
    command: ["serve"]
    environment:
      TINYSWEEPER_BIND: 0.0.0.0:8080
      TINYSWEEPER_APP_ID: ${TINYSWEEPER_APP_ID:-}
      TINYSWEEPER_APP_PRIVATE_KEY: ${TINYSWEEPER_APP_PRIVATE_KEY:-}
      TINYSWEEPER_WEBHOOK_SECRET: ${TINYSWEEPER_WEBHOOK_SECRET:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-tinysweeper=info}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
