version = 1

[review]
lanes = ["critique", "security", "tests", "commits", "description"]
strictness = 2
severity_gate = "medium"
confidence_min = 0.6
max_comments = 20
incremental = true
draft_prs = false
respect_agents_md = true

[paths]
ignore = [
    "**/Cargo.lock",
    "target/**",
    "vendor/**",
    "**/generated/**",
]

[[path_instructions]]
glob = "src/ports/**"
instructions = """
One trait per file. Flag any port whose signature leaks a concrete backend type,
and any port added without a matching offline mock.
"""

[[path_instructions]]
glob = "Cargo.toml"
instructions = """
A new non-optional dependency that pulls in an HTTP client breaks the offline
default build. Network dependencies belong behind a feature.
"""
rules = "dependencies"

# Ordered, first match wins. Test files take the test rules; everything else
# under src/ takes the Rust rules. Reversing these two entries would mean no
# test file ever sees the test rules. See presets/rules/README.md.
[[path_instructions]]
glob = "**/*{_test,test_,.test,.spec}*"
rules = "tests"

[[path_instructions]]
glob = "src/**/*.rs"
rules = "rust"

[lanes.tests]
model = "scan"

[lanes.security]
model = "deep"
fail_on = "high"
