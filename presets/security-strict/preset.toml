version = 1

# For repositories where a missed vulnerability costs more than a false
# positive. Everything below trades noise for coverage — deliberately.

[review]
lanes = ["critique", "security", "tests", "commits", "description"]
strictness = 3
severity_gate = "low"
confidence_min = 0.4
max_comments = 40
incremental = true
draft_prs = true
respect_agents_md = true

[paths]
ignore = ["**/*.lock"]

# Ordered, first match wins: the most specific glob has to come first, or the
# broader entry below it is dead. See presets/rules/README.md.
[[path_instructions]]
glob = ".github/workflows/**"
rules = "workflows"

[[path_instructions]]
glob = "**/{Cargo.toml,Cargo.lock,package.json,go.mod,requirements*.txt}"
rules = "dependencies"

[[path_instructions]]
glob = "**/{Dockerfile,*.dockerfile}"
instructions = """
Flag running as root, unpinned base image tags, secrets baked into layers, and
`ADD` from a remote URL.
"""

[lanes.critique]
model = "deep"

[lanes.security]
model = "deep"
fail_on = "medium"

[lanes.commits]
secret_rulepack = "default"
max_blob_bytes = 262144
