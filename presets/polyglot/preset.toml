version = 1

# For repositories that mix languages: a service in Go or Python, infra in
# Terraform, a frontend in TypeScript, all in one tree. Each file gets the
# rules written for its own language, and nothing else.

[review]
lanes = ["critique", "security", "tests", "commits", "description"]
strictness = 2
severity_gate = "medium"
confidence_min = 0.6
max_comments = 20
incremental = true
draft_prs = false
respect_agents_md = true

[paths]
ignore = [
    "**/node_modules/**",
    "**/vendor/**",
    "**/dist/**",
    "**/build/**",
    "**/__pycache__/**",
    "**/.terraform/**",
    "target/**",
    "**/generated/**",
]

# Ordered, first match wins: the most specific glob has to come first, or the
# broader entry below it never fires. See presets/rules/README.md. Every
# entry in this table is scoped to lanes = ["critique", "security"] — the
# only two that build a prompt for one file at a time. `tests`, `commits`
# and `description` build one prompt over every changed path with no
# `focus_path`, so an unscoped entry's rules would leak into lanes that never
# review that file on its own — a Go file in the diff putting the Go
# checklist in front of the description reviewer, say.
[[path_instructions]]
glob = "**/Dockerfile*"
rules = "dockerfile"
lanes = ["critique", "security"]

[[path_instructions]]
glob = "**/*.tf"
rules = "terraform"
lanes = ["critique", "security"]

[[path_instructions]]
glob = "**/*.tfvars"
rules = "terraform"
lanes = ["critique", "security"]

[[path_instructions]]
glob = "**/*.tfvars.json"
rules = "terraform"
lanes = ["critique", "security"]

[[path_instructions]]
glob = "**/*.tf.json"
rules = "terraform"
lanes = ["critique", "security"]

[[path_instructions]]
glob = "**/*.tfstate"
rules = "terraform"
lanes = ["critique", "security"]

[[path_instructions]]
glob = "**/*.tfstate.backup"
rules = "terraform"
lanes = ["critique", "security"]

[[path_instructions]]
glob = "**/.github/workflows/**"
rules = "workflows"
lanes = ["critique", "security"]

# Dependency manifests and their lockfiles, across every ecosystem this
# preset routes, get the dependency rules regardless of which language they
# declare dependencies for.
[[path_instructions]]
glob = "**/{Cargo.toml,Cargo.lock,package.json,package-lock.json,yarn.lock,pnpm-lock.yaml,go.mod,go.sum,requirements*.txt,pyproject.toml,poetry.lock,pom.xml,build.gradle,build.gradle.kts}"
rules = "dependencies"
lanes = ["critique", "security"]

# Test files, across every language, take the test rules before any
# language's own rules — a `_test.go` or `foo.test.ts` is judged as a test
# first, not as Go or TypeScript source. Two conventions carry none of those
# filename substrings: Java's JUnit layout (`UserServiceTest.java`,
# `src/test/java/**`) and a directory named for its contents rather than its
# filenames (`tests/api.py`, `__tests__/Widget.tsx`) — both get their own
# entries below, still ahead of the general per-extension rule.
[[path_instructions]]
glob = "**/*{_test,test_,.test,.spec}*"
rules = "tests"
lanes = ["critique", "security"]

[[path_instructions]]
glob = "**/*{Test,Tests,IT}.java"
rules = "tests"
lanes = ["critique", "security"]

[[path_instructions]]
glob = "**/src/test/**/*.java"
rules = "tests"
lanes = ["critique", "security"]

[[path_instructions]]
glob = "**/{test,tests,__tests__}/**/*.{py,rs,go,ts,tsx,js,jsx,mjs,cjs}"
rules = "tests"
lanes = ["critique", "security"]

# Scoped to the two lanes that actually read code file-by-file. `commits`,
# `description` and `tests` build one prompt over every changed path with no
# `focus_path`, so an unscoped entry here would inject every touched
# language's checklist into lanes that have nothing to do with that
# language's correctness — a Go file in the diff would put the Go rules in
# front of the description reviewer.
[[path_instructions]]
glob = "**/*.go"
rules = "go"
lanes = ["critique", "security"]

[[path_instructions]]
glob = "**/*.{ts,tsx,js,jsx,mjs,cjs}"
rules = "typescript"
lanes = ["critique", "security"]

[[path_instructions]]
glob = "**/*.java"
rules = "java"
lanes = ["critique", "security"]

[[path_instructions]]
glob = "**/*.py"
rules = "python"
lanes = ["critique", "security"]

[[path_instructions]]
glob = "**/*.sql"
rules = "sql"
lanes = ["critique", "security"]

[[path_instructions]]
glob = "**/*.sh"
rules = "shell"
lanes = ["critique", "security"]

[[path_instructions]]
glob = "**/*.rs"
rules = "rust"
lanes = ["critique", "security"]

[lanes.tests]
model = "scan"

[lanes.security]
model = "deep"
