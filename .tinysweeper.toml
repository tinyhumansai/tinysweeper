# tinysweeper reviewing tinysweeper.
#
# Kept deliberately close to the defaults: this file is the first example
# anyone reads, and a config full of overrides teaches the wrong lesson.

version = 1
preset = "rust-library"

[[path_instructions]]
glob = "src/lanes/**"
instructions = """
Every lane must be testable offline against a canned model response. Flag a lane
that reaches for the network directly, parses prose instead of structured
output, or takes a `ForgeWrite` — lanes propose, `src/apply` disposes.
"""

[[path_instructions]]
glob = "src/ports/**"
instructions = """
One trait per file, and every port needs an always-compiled offline mock. Flag a
port whose signature leaks a concrete backend type.
"""

[[path_instructions]]
glob = ".github/workflows/**"
instructions = """
Flag any widening of `permissions`, any unpinned third-party action, and any
step that interpolates untrusted context into a shell.
"""

# Retrieval on, through the same gateway the completion models use. The three
# fields below are the index partition key: change any of them and the vectors
# already written stop matching, which is why they live here rather than in the
# environment.
[embeddings]
enabled = true
provider = "openrouter"
model = "openai/text-embedding-3-small"
dimensions = 1536
api_key_env = "OPENROUTER_API_KEY"

# Issue triage, turned on for this repository so the job is exercised on real
# issues. Closing stays off: the labels and the duplicate cross-links are the
# useful half, and closing someone else's issue is the expensive mistake.
[issues]
enabled = true

# Auto-merge, turned on for this repository.
#
# Note where this takes effect. `[automerge]` is on the *not overridable* list
# in `src/config/remote`, so a repository cannot switch this on about itself —
# a pull request that could enable its own merging would be no gate at all.
# This file counts because it is the deployment's own configuration, read from
# the server's working directory, not because it sits in the reviewed
# repository.
#
# The two settings below are the whole policy decision; everything else is
# inherited from `src/config/defaults.toml`.
[automerge]
enabled = true

# The human act is the label, not an approval.
#
# `require_approvals` counts *human* approvals deliberately — a bot approving
# its own policy is not a second opinion — so leaving it at 1 on a repository
# whose pull requests are opened by its only maintainer means nothing ever
# merges, and a gate that never opens teaches people to widen it until it
# does. Applying `automerge` needs write access, so it is a real authorisation
# signal from a real person; it is just given once, up front, instead of after
# the wait for CI.
#
# Setting `allow_labels = []` here would make every green pull request from
# anybody merge itself. Do not, on a repository that takes outside
# contributions: `sensitive_paths` and the complexity caps would then be the
# only thing between a stranger and the default branch.
require_approvals = 0
allow_labels = ["automerge"]
block_labels = ["do-not-merge", "wip", "tinysweeper:human-review"]
