# tinysweeper reviewing tinysweeper.
#
# Kept deliberately close to the defaults: this file is the first example
# anyone reads, and a config full of overrides teaches the wrong lesson.

version = 1
preset = "rust-library"

# The eval corpus is recorded data, not code: a cassette is a model's answer
# frozen for offline replay, and a fixture is a forge state frozen by
# `eval add`. Reviewing them produces findings like "populate the cassette's
# value field" — a request to edit what a model said — and two of those held
# tinysweeper#154 at changes-requested. Cases (`evals/cases/*.toml`) are
# labels a human wrote and stay reviewable.
[paths]
ignore = [
    "**/Cargo.lock",
    "target/**",
    "vendor/**",
    "**/generated/**",
    "evals/cassettes/**",
    "evals/fixtures/**",
]

[[path_instructions]]
glob = "src/lanes/**"
instructions = """
Every lane must be testable offline against a canned model response. Flag a lane
that reaches for the network directly, parses prose instead of structured
output, or takes a `ForgeWrite` — lanes propose, `src/apply` disposes.
"""

[[path_instructions]]
glob = "src/ports/**"
instructions = """
One trait per file, and every port needs an always-compiled offline mock. Flag a
port whose signature leaks a concrete backend type.
"""

[[path_instructions]]
glob = ".github/workflows/**"
instructions = """
Flag any widening of `permissions`, any unpinned third-party action, and any
step that interpolates untrusted context into a shell.
"""

# Completions go straight to Surplus, not through the box's LLM ladder. The
# ladder put a 120 s request timeout in front of a model that, measured on
# 2026-10-22 against Surplus directly with a 7.7k-token review prompt, takes
# 225–270 s whenever reasoning is on: deepseek-v4.1-flash thinks ~12k tokens at
# ~53 tok/s and leaves ~25 tokens of answer. Surplus ignores the effort level
# (`low`, `medium` and `high` all spent the same ~12k), so the only lever is
# off, and off answers the same prompt in 3–7 s at ~$0.00005 instead of
# ~$0.0015. Surplus reports its charge as `usage.buyer_cost_micro`, which Embed
# settles against the budget directly.
#
# Every tier is one model because the cost difference between them is gone at
# these prices. The fallback is deepseek-v4-flash (4–15 s with reasoning off);
# GLM-5.3 cannot be a fallback, Surplus rejects it as thinking-only.
[models]
gateway = "surplus"
base_url = "https://api.surplusintelligence.ai/v1"
api_key_env = "SURPLUS_API_KEY"
# Reasoning off everywhere. The per-call efforts override the deployment-wide
# one, so leaving them at their `medium`/`low` defaults would turn the 12k
# thinking budget back on for exactly the reviewer calls this is about.
reasoning_effort = "off"
reviewer_reasoning_effort = "off"
falsify_reasoning_effort = "off"
summary_reasoning_effort = "off"
# Healthy calls finish in seconds; a seller that stalls should cost one short
# wait before the fallback model, not minutes.
request_timeout_ms = 90000
scan = "deepseek-v4.1-flash"
flash = "deepseek-v4.1-flash"
deep = "deepseek-v4.1-flash"
fallback = ["deepseek-v4-flash"]

[models.provider]
order = []
allow_fallbacks = true
last_resort_unpinned = false

# Admission prices are operator-verified upper bounds in USD per million
# tokens. deepseek-v4.1-flash has no public price row, so it needs one here;
# deepseek-v4-flash is priced in `harness::pricing`. They do not constrain
# billing — Surplus's reported charge settles each call — and the bound is
# deliberately the old `deep` alias's, well above what Surplus charged.
[models.budget_prices."deepseek-v4.1-flash"]
input = 0.4
cached = 0.4
output = 1.8

# Retrieval uses the embedding route served by the production ladder.
# `vectors-oai3` returns text-embedding-3-large at 1024 dimensions; it is a
# separate space from BGE-M3 (`vectors`), which this box does not serve.
# Naming the space in the signature partitions existing indexes so a model
# change re-indexes rather than mixing incompatible vectors. The three
# signature fields below are the index partition key: change any of them
# and the vectors already written stop matching, which is why they live here rather than in the environment, and
# why moving here from `openrouter:openai/text-embedding-3-small:1536` means
# each repository re-indexes on its next push.
[embeddings]
enabled = true
provider = "ladder"
model = "vectors-oai3"
dimensions = 1024
api_key_env = "LADDER_API_KEY"
base_url = "https://sweeper.tinyhumans.ai:7443/v1/embeddings"

# The vendored libraries the reviewed repositories call into. A review may
# read these submodules and the indexer fetches them; anything else named in
# a `.gitmodules` is left alone. opencompany's core library is
# `tinyhumansai/tinyhivemind`; this repository vendors openhuman, and
# openhuman in turn vendors tinyagents and tinyflows.
[retrieval]
submodules = [
    "tinyhumansai/tinyhivemind",
    "tinyhumansai/openhuman",
    "tinyhumansai/tinyagents",
    "tinyhumansai/tinyflows",
]

# Agent-facing repository research and issue creation. The bearer is supplied
# only by the deployment environment; this switch merely mounts the route.
# The two product repositories are here for Teeny, the Discord bot, which
# answers members' questions from their docs and files their bug reports;
# both are public. Keep private repositories off this list — the bearer is
# shared with a service that talks to the whole server.
[mcp]
enabled = true
token_env = "TINYSWEEPER_MCP_TOKEN"
allowed_org = "tinyhumansai"
allowed_repos = [
  "tinyhumansai/tinysweeper",
  "tinyhumansai/openhuman",
  "tinyhumansai/opencompany",
]

# Issue triage, turned on for this repository so the job is exercised on real
# issues. Closing stays off: the labels and the duplicate cross-links are the
# useful half, and closing someone else's issue is the expensive mistake.
[issues]
enabled = true

# Auto-merge, turned on for this repository.
#
# Note where this takes effect. `[automerge]` is on the *not overridable* list
# in `src/config/remote`, so a repository cannot switch this on about itself —
# a pull request that could enable its own merging would be no gate at all.
# This file counts because it is the deployment's own configuration, read from
# the server's working directory, not because it sits in the reviewed
# repository.
#
# The two settings below are the whole policy decision; everything else is
# inherited from `src/config/defaults.toml`.
[automerge]
enabled = true

# The human act is the label, not an approval.
#
# `require_approvals` counts *human* approvals deliberately — a bot approving
# its own policy is not a second opinion — so leaving it at 1 on a repository
# whose pull requests are opened by its only maintainer means nothing ever
# merges, and a gate that never opens teaches people to widen it until it
# does. Applying `automerge` needs write access, so it is a real authorisation
# signal from a real person; it is just given once, up front, instead of after
# the wait for CI.
#
# Setting `allow_labels = []` here would make every green pull request from
# anybody merge itself. Do not, on a repository that takes outside
# contributions: `sensitive_paths` and the complexity caps would then be the
# only thing between a stranger and the default branch.
require_approvals = 0
allow_labels = ["automerge"]
block_labels = ["do-not-merge", "wip", "tinysweeper:human-review"]

# `merge`, not the `squash` default, because this repository has squash and
# rebase both disabled. The forge would answer a squash request with a 405 and
# the policy would report `Outcome::Rejected` — correct, safe, and completely
# invisible unless somebody reads the log, which is the shape of bug that makes
# a working feature look broken.
method = "merge"
