# The reusable workflow every repository calls.
#
# This file is how tinysweeper rolls out without a hosted server: a repository
# references it in one line and gets the whole review, and changes to the review
# land here rather than in 43 copies. It is the one thing a server would have
# bought us, bought instead with `workflow_call`.
#
# Downstream usage:
#
#   name: tinysweeper
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review, edited]
#     issue_comment:
#       types: [created]
#     pull_request_review:
#       types: [submitted]
#     pull_request_review_comment:
#       types: [created]
#   concurrency:
#     group: tinysweeper-${{ github.event.pull_request.number || github.event.issue.number }}
#     cancel-in-progress: true
#   jobs:
#     review:
#       uses: tinyhumansai/tinysweeper/.github/workflows/review.yml@v1
#       secrets:
#         openrouter-api-key: ${{ secrets.TINYSWEEPER_OPENROUTER_KEY }}
#         app-private-key: ${{ secrets.TINYSWEEPER_APP_PRIVATE_KEY }}
#       with:
#         app-id: ${{ vars.TINYSWEEPER_APP_ID }}
#
# Secrets are passed by name rather than with `secrets: inherit`. Inheriting
# hands the called workflow every secret the caller has, which our own security
# lane flags — and being flagged by your own bot is a good reason to fix the
# example rather than the rule.

name: tinysweeper review

on:
  workflow_call:
    inputs:
      app-id:
        description: GitHub App id used to mint an installation token.
        required: false
        type: string
      lanes:
        description: Comma-separated lanes to run, overriding the config.
        required: false
        type: string
      config:
        description: Path to .tinysweeper.toml, if it is not in a default location.
        required: false
        type: string
      dry-run:
        description: Render what would be posted without writing anything.
        required: false
        type: boolean
        default: false
      version:
        description: tinysweeper release to run.
        required: false
        type: string
        default: v1
    secrets:
      openrouter-api-key:
        description: Key for the model gateway.
        required: true
      app-private-key:
        description: >
          Private key for the tinysweeper GitHub App. Optional: without it the
          workflow falls back to GITHUB_TOKEN, which cannot post checks on pull
          requests from forks.
        required: false

jobs:
  # Two jobs, deliberately. `AGENTS.md` says the model never holds a write
  # token, and a single job would break that: the App token would be in the
  # environment of the very process making model calls.
  #
  # So `review` runs read-only and hands its verdict over as an artifact, and
  # `publish` mints the write token afterwards and does nothing but post. That
  # is the propose/apply split the whole design rests on, expressed as job
  # boundaries — the one place Actions can enforce it for us.
  review:
    name: review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only. This job holds the model key; it must not hold write scope.
    permissions:
      contents: read
    # `issue_comment` fires for issues as well as pull requests, and the payload
    # only distinguishes them by the presence of this field.
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
      # The pull request number lives in a different place depending on which
      # event woke us up.
      - name: Resolve the pull request number
        id: pr
        env:
          FROM_PR: ${{ github.event.pull_request.number }}
          FROM_ISSUE: ${{ github.event.issue.number }}
        run: echo "number=${FROM_PR:-$FROM_ISSUE}" >> "$GITHUB_OUTPUT"

      - name: Resolve the head SHA
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # A comment event carries no head SHA, so ask for it.
          sha=$(gh api "/repos/$REPO/pulls/$NUMBER" --jq .head.sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # LOAD-BEARING: the head ref is checked out for *reading* only. Nothing in
      # this workflow builds it, installs its dependencies, or runs any script
      # from it. That invariant is what makes reviewing fork pull requests safe;
      # see the security boundary in AGENTS.md before adding any step here.
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.head.outputs.sha }}
          # Full history: the commits lane walks the pull request's range, and a
          # shallow clone has nothing to walk.
          fetch-depth: 0
          persist-credentials: false

      - name: Install tinysweeper
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$VERSION" \
            --repo tinyhumansai/tinysweeper \
            --pattern 'tinysweeper-x86_64-unknown-linux-gnu' \
            --output /usr/local/bin/tinysweeper
          chmod +x /usr/local/bin/tinysweeper
          tinysweeper --version

      - name: Review
        env:
          # Read-only on purpose. This step makes the model calls, so it must
          # not be able to write even if something goes wrong.
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.openrouter-api-key }}
          # Untrusted values reach the binary as environment variables, never
          # interpolated into this shell. A pull request title is attacker
          # controlled.
          TS_REPO: ${{ github.repository }}
          TS_PR: ${{ steps.pr.outputs.number }}
          TS_LANES: ${{ inputs.lanes }}
          TS_CONFIG: ${{ inputs.config }}
          TS_DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          args=(review --repo "$TS_REPO" --pr "$TS_PR")
          [ -n "$TS_LANES" ] && args+=(--lanes "$TS_LANES")
          [ -n "$TS_CONFIG" ] && args+=(--config "$TS_CONFIG")
          [ "$TS_DRY_RUN" = "true" ] && args+=(--dry-run)
          tinysweeper "${args[@]}" --propose-to findings.json

      - name: Fail if the review left the checkout dirty
        run: |
          set -euo pipefail
          # The review reads; it never writes. A dirty tree means something
          # executed that should not have, and publishing on top of that would
          # be publishing a verdict about a tree nobody reviewed.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the review modified the checkout; refusing to continue"
            git status --porcelain
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tinysweeper-findings
          path: findings.json
          retention-days: 1

  publish:
    name: publish
    needs: review
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      # The write token is minted here and nowhere else — after every model
      # call in the `review` job has returned. A fork pull request gives
      # GITHUB_TOKEN read-only scope, so the App token is what makes posting a
      # check run on a fork possible at all.
      - name: Mint an installation token
        id: app-token
        if: inputs.app-id != '' && secrets.app-private-key != ''
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - uses: actions/download-artifact@v4
        with:
          name: tinysweeper-findings

      - name: Install tinysweeper
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$VERSION" \
            --repo tinyhumansai/tinysweeper \
            --pattern 'tinysweeper-x86_64-unknown-linux-gnu' \
            --output /usr/local/bin/tinysweeper
          chmod +x /usr/local/bin/tinysweeper

      # No OPENROUTER_API_KEY here: this step must not be able to call a model.
      # It applies a verdict that was already reached.
      - name: Publish
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          TS_REPO: ${{ github.repository }}
          TS_PR: ${{ needs.review.outputs.number }}
        run: tinysweeper apply --repo "$TS_REPO" --pr "$TS_PR" --findings findings.json
