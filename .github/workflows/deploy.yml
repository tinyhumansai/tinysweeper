# Roll the deployed server onto the latest published image, on request.
#
# Deliberately manual: this fires only from the Actions tab, never off a push or
# a green CI run. Landing on `main` publishes an image; a human decides when the
# box takes it. That keeps the deploy an operator action with a name against it,
# and keeps a merge from being a production event.
#
# There is no registry push here and no build: `ci.yml` publishes to GHCR, and
# the box pulls from GHCR itself. This workflow is a *button* in the same sense
# as `manual-review.yml` — it opens an SSH session to the one host that runs the
# Compose stack (see `deploy/README.md`) and asks Compose to pull and recreate
# the server. It holds an SSH key and nothing else: no model credential, no
# GitHub write token, no checkout of the repository.
#
# The stack on the box tracks a moving tag (`TINYSWEEPER_IMAGE_TAG`, default
# `latest`), which is why `pull` followed by `up -d` is a deploy. To roll a
# specific commit instead, pass its SHA as the `image_tag` input — CI already
# tags every image with `type=sha,format=long`.
name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy. Empty keeps the box on its configured tag (normally `latest`)"
        required: false
        type: string

# Nothing here touches the GitHub API. The SSH credential is a secret, not a
# permission, so the job's own token is given nothing.
permissions: {}

# Deploys are serialised and never cancelled: interrupting a `compose up`
# mid-flight leaves the box in a state neither this run nor the next described.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  rollout:
    name: Pull and recreate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The `production` GitHub Environment carries required reviewers, the
    # deploy log, and the environment-scoped secrets below.
    environment:
      name: production
      url: ${{ vars.TINYSWEEPER_SERVER_URL }}
    steps:
      - name: Open the SSH session
        env:
          # A private key whose public half is in the deploy user's
          # `authorized_keys` on the box. Generate a dedicated one — never a
          # personal key — with `ssh-keygen -t ed25519 -f deploy_key -N ''`.
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # The host key, from `ssh-keyscan -t ed25519 <host>`. Pinning it is
          # what stops the runner from handing the deploy key's session to
          # whatever answers at that address.
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'droid' }}
        run: |
          set -euo pipefail

          for name in DEPLOY_SSH_KEY DEPLOY_SSH_KNOWN_HOSTS DEPLOY_HOST; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set, so there is no box to talk to."
              exit 1
            fi
          done

          # The key is written to the runner's own temp dir at 0600 and passed
          # by file. It never becomes a command-line argument, which would be
          # visible in the process table.
          umask 077
          mkdir -p "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"

          cat > "$RUNNER_TEMP/ssh/config" <<CONF
          Host box
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile $RUNNER_TEMP/ssh/key
            IdentitiesOnly yes
            UserKnownHostsFile $RUNNER_TEMP/ssh/known_hosts
            StrictHostKeyChecking yes
            ConnectTimeout 20
          CONF
          echo "SSH_CONFIG=$RUNNER_TEMP/ssh/config" >> "$GITHUB_ENV"

      - name: Pull and recreate the server
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          # Where the checkout lives on the box. `deploy/README.md` puts it here.
          STACK_DIR: ${{ vars.DEPLOY_STACK_DIR || '/opt/tinysweeper' }}
        run: |
          set -euo pipefail

          # The script runs on the box under `bash -s`, with the tag and the
          # directory passed as arguments rather than interpolated into the
          # script text, so a stray quote in an input cannot become a command.
          # `printf %q` because ssh joins its arguments into one command line
          # for the remote shell: without it an empty tag simply disappears
          # and the script reads the wrong positional parameter.
          ssh -F "$SSH_CONFIG" box "bash -s -- $(printf '%q ' "$STACK_DIR" "$IMAGE_TAG")" <<'REMOTE'
          set -euo pipefail
          stack_dir="$1"
          image_tag="$2"
          cd "$stack_dir"

          # `.env` must win over the login shell. Compose interpolates
          # `${VAR}` from the process environment first and the env file
          # second, and the box's `~/.zshenv` exports an OPENROUTER_API_KEY of
          # its own for other tooling — zsh sources it even for this
          # non-interactive ssh command — so a deploy was silently handing the
          # container the shell's key instead of the one the operator set in
          # `.env`. Sourcing `.env` here restores the precedence the runbook
          # describes.
          set -a
          # shellcheck disable=SC1091
          . ./.env
          set +a

          compose() {
            docker compose -f docker-compose.yml -f docker-compose.prod.yml "$@"
          }

          # An explicit tag for this one run only: exported for the `pull` and
          # `up` below, not written to `.env`, so the next routine deploy goes
          # back to the box's configured tag.
          if [ -n "$image_tag" ]; then
            export TINYSWEEPER_IMAGE_TAG="$image_tag"
          fi

          echo "::group::pull"
          compose pull tinysweeper
          echo "::endgroup::"

          echo "::group::up"
          # `--wait` blocks until every service is healthy or gives up, so a
          # crash-looping image fails the job instead of going green the
          # instant the container is created.
          compose up -d --remove-orphans --wait --wait-timeout 300
          echo "::endgroup::"

          echo "::group::status"
          compose ps
          compose images tinysweeper
          echo "::endgroup::"

          # Reclaim the previous image now that the new one is proven to serve.
          docker image prune -f >/dev/null
          REMOTE

      - name: Probe the public endpoint
        env:
          SERVER: ${{ vars.TINYSWEEPER_SERVER_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SERVER:-}" ]; then
            echo "TINYSWEEPER_SERVER_URL is not set; skipping the external probe."
            exit 0
          fi
          # Cloudflare and nginx sit between here and the container, so give
          # the public side a few tries rather than trusting the first answer.
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS --max-time 10 "${SERVER%/}/healthz" >/dev/null; then
              echo "healthy after $attempt attempt(s)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${SERVER%/}/healthz did not answer 200 within a minute of the rollout."
          exit 1
