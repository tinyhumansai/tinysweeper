name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The offline build. This job exists to defend the invariant that the default
  # feature set links no HTTP client and the test suite never touches the
  # network — the property that makes `local-review` and hermetic CI possible.
  # If this job starts needing credentials, something has leaked out of a
  # feature gate.
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      # Cheap step whose only job is to name a stale lockfile clearly, before a
      # confusing failure deeper in the build.
      - name: Verify Cargo.lock is in sync
        run: cargo metadata --locked --format-version 1 > /dev/null

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  # The networked features. Split from the offline job so a failure here can
  # never be mistaken for a break in the hermetic core, and so branch protection
  # can require them separately.
  rust-gated:
    name: Rust (harness, github)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --features harness,github --all-targets

      - name: Clippy
        run: cargo clippy --locked --no-deps --features harness,github --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --features harness,github --lib

      # `serve` is the only production surface, and until this ran its tests
      # were compiled but never executed: `check --all-features` below type-checks
      # them without running them, and no other job enables the feature. Four
      # tests covering the `$vectorSearch`/`$rankFusion` pipeline shape sat
      # failing on main unnoticed because of exactly that gap. Tests needing a
      # live MongoDB are `#[ignore]`d, so this stays offline.
      - name: Test (serve)
        run: cargo test --locked --features serve --lib

      # Catches feature combinations nothing else builds, including the
      # examples that need credentials at run time but must still compile.
      - name: Check all features
        run: cargo check --locked --all-features --all-targets

  # Builds on every pull request; pushes only from main. A pull request must
  # never be able to publish an image tag, because the image is what downstream
  # repositories would run.
  docker:
    name: Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # No `packages: write` here. This job runs on pull requests, and a token
    # able to publish an image is a token a pull request should never hold —
    # the image is what downstream repositories run. Publishing happens in the
    # separate job below, which only runs on main.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-publish:
    name: Docker (publish)
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
