# Review quality, measured against two separately recorded groups in `evals/`.
#
# This is the *replay* half: it runs the real engine over the committed
# cassettes — no key, no network, free — scores the proposals under the
# current matching rules. The legacy group uses compiled-in defaults and is
# diagnostic-only; five historical cases use their pinned recording profile
# and require strict completion. Both scorecards appear in the step summary.
#
# The *live* half — `eval run --record` — is an operator command, not a job
# here. Every model call goes through the box's LLM ladder
# (`.tinysweeper.toml`, `[models]`), which listens on the fleet's own hosts
# and is not reachable from a hosted runner; before that it wanted an
# `OPENROUTER_API_KEY` this repository never had, so the recording step here
# 401'd on every call and passed anyway. A run that records nothing and goes
# green is worse than no run. Re-record only on an authorized operator machine
# (`evals/README.md`); this workflow never contacts a provider.
#
# Deliberately **not** a required check. Run-to-run variance has not been
# measured yet: the gateway routes where it likes, no `seed` is honoured, and
# gating merges on a noisy metric teaches people to re-run CI rather than to
# read it. Make it required once the spread across repeats is known.
name: eval

on:
  workflow_dispatch:
  pull_request:
    # Only what can move a score. A change to the server or the automerge gate
    # cannot change what a lane finds, so it should not pay for a replay.
    # Both the default-profile group and the historical recording profile are
    # explicit score inputs. `.tinysweeper.toml` is deliberately ignored.
    paths:
      - "src/lanes/**"
      - "src/harness/prompt.rs"
      - "src/harness/schema.rs"
      - "src/falsify/**"
      - "src/flows/**"
      - "src/eval/**"
      - "src/config/defaults.toml"
      - "presets/**"
      - "evals/**"
      - "scripts/check-eval-scorecard.py"
      - "scripts/test_check_eval_scorecard.py"
      - ".github/workflows/eval.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    # Contributor code is never executed: the replay builds and runs the
    # engine from the checkout, so a fork's branch must not reach it. No
    # secret is at stake any more — the replay needs none — but the binary
    # and its build scripts are the contributor's, and that is the invariant.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # The replay runs the engine, whose build scripts and binary must
          # never be able to read a GITHUB_TOKEN out of the checkout's git
          # config. The workflow needs no authenticated git at all.
          persist-credentials: false

      # Pinned to commit SHAs rather than `@stable` / `@v2`; Dependabot bumps
      # these pins.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Test scorecard validation
        run: python3 -B -m unittest scripts/test_check_eval_scorecard.py

      # These older cassettes were recorded under the compiled-in defaults.
      # Keep the group explicit so future cases cannot silently join it with
      # a different model profile.
      - name: Replay the legacy default-profile cases
        run: |
          cargo run --locked --features harness,github -- \
            eval run --config src/config/defaults.toml \
            --case oc-2313-round-boundary-leaks \
            --case ts-0045-kernel-bypass-hallucination \
            --case ts-0068-description-anchored-to-code \
            --out target/eval-ci/legacy-default
          python3 scripts/check-eval-scorecard.py \
            target/eval-ci/legacy-default/scorecard.json \
            --diagnostic \
            --expected oc-2313-round-boundary-leaks \
            --expected ts-0045-kernel-bypass-hallucination \
            --expected ts-0068-description-anchored-to-code \
            >> "$GITHUB_STEP_SUMMARY"

      # These five externally pinned historical cases use the dedicated
      # GPT-OSS/Novita recording profile. Score only this explicit group and
      # report its measured values without comparing to a differently bounded
      # corpus baseline.
      - name: Replay the historical GPT-OSS/Novita cases
        if: ${{ !cancelled() }}
        run: |
          cargo run --locked --features harness,github -- \
            eval run --config evals/recording.gptoss-novita.toml \
            --case tm-0102-memory-pending-debug-state \
            --case oh-8061-standalone-local-only-policy \
            --case oh-8061-speech-redirect-origin \
            --case oh-8061-privacy-docs-contract-mismatch \
            --case oh-8076-credential-read-failure-migration \
            --out target/eval-ci/historical-gptoss-novita
          python3 scripts/check-eval-scorecard.py \
            target/eval-ci/historical-gptoss-novita/scorecard.json \
            --expected tm-0102-memory-pending-debug-state \
            --expected oh-8061-standalone-local-only-policy \
            --expected oh-8061-speech-redirect-origin \
            --expected oh-8061-privacy-docs-contract-mismatch \
            --expected oh-8076-credential-read-failure-migration \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the legacy default-profile scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-legacy-default
          path: target/eval-ci/legacy-default/

      - name: Upload the historical GPT-OSS/Novita scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scorecard-historical-gptoss-novita
          path: target/eval-ci/historical-gptoss-novita/
