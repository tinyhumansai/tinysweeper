# Review quality, measured against the labelled corpus in `evals/`.
#
# This is the *replay* half: it runs the real engine over the committed
# cassettes — no key, no network, free — scores the proposals under the
# current matching rules, and reports the drift against the committed
# baseline as a step summary with the scorecard attached. `cargo test` in
# `ci.yml` already asserts the two guarded regressions still hold; this job
# is where the whole scorecard is readable per pull request.
#
# The *live* half — `eval run --record` — is an operator command, not a job
# here. Every model call goes through the box's LLM ladder
# (`.tinysweeper.toml`, `[models]`), which listens on the fleet's own hosts
# and is not reachable from a hosted runner; before that it wanted an
# `OPENROUTER_API_KEY` this repository never had, so the recording step here
# 401'd on every call and passed anyway. A run that records nothing and goes
# green is worse than no run. Re-record on a box with the ladder
# (`evals/README.md`), commit the cassettes and the refreshed baseline, and
# this job replays them.
#
# Deliberately **not** a required check. Run-to-run variance has not been
# measured yet: the gateway routes where it likes, no `seed` is honoured, and
# gating merges on a noisy metric teaches people to re-run CI rather than to
# read it. Make it required once the spread across repeats is known.
name: eval

on:
  workflow_dispatch:
  pull_request:
    # Only what can move a score. A change to the server or the automerge gate
    # cannot change what a lane finds, so it should not pay for a replay.
    # The replay runs under `src/config/defaults.toml`, so that file can move
    # a score and `.tinysweeper.toml`, which it deliberately ignores, cannot.
    paths:
      - "src/lanes/**"
      - "src/harness/prompt.rs"
      - "src/harness/schema.rs"
      - "src/falsify/**"
      - "src/flows/**"
      - "src/eval/**"
      - "src/config/defaults.toml"
      - "presets/**"
      - "evals/**"
      - ".github/workflows/eval.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          # The replay runs the engine, whose build scripts and binary must
          # never be able to read a GITHUB_TOKEN out of the checkout's git
          # config. The workflow needs no authenticated git at all.
          persist-credentials: false

      # Pinned to commit SHAs rather than `@stable` / `@v2`; Dependabot bumps
      # these pins.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      # Strict replay: a call the cassette cannot answer fails its case with
      # "re-record the corpus", which is the staleness this exists to make
      # loud — a prompt changed and nobody recorded it.
      #
      # Under the compiled-in defaults, not this repository's
      # `.tinysweeper.toml`: the cassettes are keyed by the model name each
      # call went to, and are recorded under the defaults so that `cargo
      # test`'s committed-corpus replay and this one read the same tapes.
      # The repository config names *ladders* (`flash`, `deep`) that only
      # resolve on a box running one; replaying it here would miss every
      # call and report a stale corpus that is not stale.
      - name: Replay the corpus
        run: |
          cargo run --locked --features harness,github -- \
            eval run --config src/config/defaults.toml

      # `eval run` scores inline as it goes, but the documented pipeline keeps
      # scoring separate for exactly the case here: re-reading the proposals
      # on disk under the current matching rule before reporting, so a rule
      # edit between records never reports off a stale scorecard.
      - name: Score the corpus
        run: |
          cargo run --locked --features harness,github -- \
            eval score --config src/config/defaults.toml

      - name: Compare against the committed baseline
        run: |
          cargo run --locked --features harness,github -- \
            eval report --baseline evals/baselines/current.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scorecard
          path: evals/runs/latest/
