# This checkout is a single package. Keeping an empty workspace root prevents
# Cargo from inheriting the superproject workspace that owns `worktrees/`, while
# still allowing the vendored dependencies to retain their own workspaces.
[workspace]

[package]
name = "tinysweeper"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinysweeper"
description = "A GitHub review bot that fans a pull request out across independently-gated check runs."
readme = "README.md"
keywords = ["github", "code-review", "agents", "tinyagents", "bot"]
categories = ["development-tools", "command-line-utilities"]
# Examples are declared explicitly so credential-needing smoke tests never
# build in CI. See examples/ and the [[example]] blocks at the bottom.
autoexamples = false

[dependencies]
# --- always compiled: the offline core ---
# Every port is a trait plus an always-compiled offline mock; only the real
# network-backed implementation sits behind a feature. `cargo build` with
# default features links no HTTP client and `cargo test` never touches the
# network. This invariant is load-bearing for CI and for `local-review`.
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "sync", "time", "signal"] }
# `url` only parses; it opens no socket, so it belongs with the offline core
# above. `crate::memory::endpoint_allowed` needs the exact host resolution
# `reqwest` itself uses — including how a redirect or `user@host` authority
# is read — and a hand-rolled parser cannot promise that.
url = "2"

# --- always compiled: the repository graph's parsers ---
# tree-sitter links C grammars, not a network client, so it needs no feature
# gate and the offline invariant above still holds. The grammars are what let
# `src/graph/` extract real symbols instead of matching identifiers with a
# regex; `tree-sitter-typescript` ships both the TypeScript and TSX grammars,
# which is why JavaScript has its own grammar only for plain `.js` files.
streaming-iterator = "0.1"
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

# --- optional: the agent harness ---
# tinyagents unconditionally links reqwest, so it is gated even though it is
# central to the product. The `Model` port and `MockModel` compile without it;
# only `harness::model::TinyAgentsModel` needs it.
tinyagents = { package = "tinyagents-harness", git = "https://github.com/tinyhumansai/tinyagents.git", rev = "44afb2e6884690a59eb43e268a09868a9852c410", optional = true }
tinyinference = { git = "https://github.com/tinyhumansai/tinyagents.git", rev = "44afb2e6884690a59eb43e268a09868a9852c410", optional = true }

# --- the orchestration graph ---
# Not optional, and that is the point: with default features tinyflows links no
# HTTP client (its `reqwest` is gated behind `chrome-extension`/`host-caps`,
# neither of which is enabled), so lane orchestration compiles and is tested in
# the offline default build. Every outside-world call it makes goes through a
# capability trait this crate implements in `src/flows/caps.rs`, so the model
# still reaches the network through exactly one adapter.
tinyflows = { git = "https://github.com/tinyhumansai/tinyflows.git", rev = "3276dd10bf0367b30223abf726e3e878d44036fb", default-features = false }

# --- optional: the webhook server ---
# Reversed an earlier decision to go Actions-only. The arguments that changed
# it: a contributor/whitelist database has nowhere to live in a stateless
# workflow, 43 repositories' worth of runner minutes is real money, and
# replying to a comment within seconds needs an event loop rather than a cold
# runner. What did *not* change: resolving a review thread and reacting to a
# comment still emit no webhook, so that state is polled either way.
axum = { version = "0.8", optional = true }
hmac = { version = "0.13", optional = true }
# `rust_crypto` picks the provider explicitly: jsonwebtoken 11 panics at the
# first signature if neither backend feature is chosen, and a panic on the
# first webhook is a bad way to discover a build flag.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"], optional = true }
mongodb = { version = "3", optional = true }
bson = { version = "2", optional = true }
subtle = { version = "2", optional = true }
# Used by the indexer to hold one shallow checkout while it is read. A
# dev-dependency already, so this adds nothing to the lock file — it becomes a
# runtime dependency only under `serve`.
tempfile = { version = "3", optional = true }
tower-http = { version = "0.7", features = ["trace", "limit"], optional = true }

# --- optional: the GitHub forge adapter ---
octocrab = { version = "0.54", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

[features]
# Offline by default: mock forge, mock model, deterministic scanners. This is
# what CI's first job builds and what `cargo test` runs against.
default = ["treesitter"]
# The tinyagents-backed model provider (OpenRouter / Moonshot / MiniMax, all
# one OpenAI-compatible code path).
harness = ["dep:tinyagents", "dep:tinyinference", "dep:reqwest"]
# The real GitHub adapter behind the `Forge` port.
github = ["dep:octocrab", "dep:reqwest"]
# The CortexDB adapter behind the `Memory` port. The whole memory layer —
# ingest, recall, the prompt block — is always compiled and tested offline
# against `MockMemory`; only `memory::cortex` speaks HTTP.
cortex = ["dep:reqwest"]
# The real Sentry adapter behind the `SentryApi` port. Sweeping polls sentry.io,
# so it is network and therefore gated; the whole promotion pipeline — the
# redaction boundary, the four steps, every policy decision — is always
# compiled and tested offline against `MockSentry`.
sentry = ["dep:reqwest"]
# The webhook server: `tinysweeper serve`.
serve = [
    "dep:axum",
    "dep:hmac",
    "dep:jsonwebtoken",
    "dep:mongodb",
    "dep:bson",
    "dep:subtle",
    "dep:tempfile",
    "dep:tower-http",
    "cortex",
    "github",
    "harness",
]
# Symbol-aware chunking. Without it `chunk` still works, on the line splitter,
# and every chunk honestly reports itself as unparsed rather than pretending a
# grammar named its enclosing symbol.
treesitter = []
# Everything a production run turns on.
all = ["cortex", "harness", "github", "sentry", "serve", "treesitter"]

[dev-dependencies]
tempfile = "3"
# Only for `ServiceExt::oneshot`, which is how an axum router is driven in a
# test: the point of the manual-review tests is that the auth layer runs before
# the handler, and calling the handler directly would skip exactly that.
tower = { version = "0.5", features = ["util"] }

# Declared explicitly (`autoexamples = false`) so a credential-needing smoke
# test never builds in CI. This one needs an embedding provider and a MongoDB
# 8.2+ deployment with mongot attached; `serve` pulls in `harness` for the
# provider adapter.
[[example]]
name = "index_and_retrieve"
required-features = ["serve"]

# Needs a running CortexDB; see the example's own docs.
[[example]]
name = "memory_review"
required-features = ["cortex"]
