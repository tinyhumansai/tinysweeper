[workspace]
# tinysweeper is a single crate at the root. Review *policy* lives under
# presets/ as data (a preset.toml + docs per named policy), not as Cargo
# crates — adding a preset is a new folder, never a new member. Downstream
# repos configure the bot with a `.tinysweeper.toml`, also data.
members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/tinyhumansai/tinysweeper"

[workspace.dependencies]
tinysweeper = { path = "." }

[package]
name = "tinysweeper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A GitHub review bot that fans a pull request out across independently-gated check runs."
readme = "README.md"
keywords = ["github", "code-review", "agents", "tinyagents", "bot"]
categories = ["development-tools", "command-line-utilities"]
# Examples are declared explicitly so credential-needing smoke tests never
# build in CI. See examples/ and the [[example]] blocks at the bottom.
autoexamples = false

[dependencies]
# --- always compiled: the offline core ---
# Every port is a trait plus an always-compiled offline mock; only the real
# network-backed implementation sits behind a feature. `cargo build` with
# default features links no HTTP client and `cargo test` never touches the
# network. This invariant is load-bearing for CI and for `local-review`.
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "fs", "sync", "time"] }

# --- optional: the agent harness ---
# tinyagents unconditionally links reqwest, so it is gated even though it is
# central to the product. The `Model` port and `MockModel` compile without it;
# only `harness::model::TinyAgentsModel` needs it.
tinyagents = { path = "vendor/tinyagents", optional = true }

# --- optional: the GitHub forge adapter ---
octocrab = { version = "0.54", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }

# --- optional: the webhook server (GitHub App deployment) ---
axum = { version = "0.8", optional = true }
hmac = { version = "0.13", optional = true }
jsonwebtoken = { version = "11", optional = true }

[features]
# Offline by default: mock forge, mock model, deterministic scanners. This is
# what CI's first job builds and what `cargo test` runs against.
default = []
# The tinyagents-backed model provider (OpenRouter / Moonshot / MiniMax, all
# one OpenAI-compatible code path).
harness = ["dep:tinyagents"]
# The real GitHub adapter behind the `Forge` port.
github = ["dep:octocrab", "dep:reqwest"]
# Webhook server mode (`tinysweeper serve`) for the hosted GitHub App.
serve = ["dep:axum", "dep:hmac", "dep:jsonwebtoken", "github"]
# Everything a production deployment turns on.
all = ["harness", "github", "serve"]

[dev-dependencies]
tempfile = "3"
